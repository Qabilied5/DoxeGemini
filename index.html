<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qabil - AI Assistant</title>
    <style>
      :root {
        --bg-dark: #0a0c10;
        --accent-cyan: #00f2fe;
        --accent-purple: #8f00ff;
        --text-main: #ffffff;
        --text-dim: #a0a0a0;
        --glass: rgba(255, 255, 255, 0.05);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        overflow-x: hidden;
        min-height: 100vh;
      }

      /* Animasi Background */
      .background-glow {
        position: fixed;
        top: -10%;
        right: -10%;
        width: 500px;
        height: 500px;
        background: radial-gradient(
          circle,
          rgba(143, 0, 255, 0.15) 0%,
          transparent 70%
        );
        z-index: -1;
        filter: blur(80px);
      }

      /* Navigation */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 30px 8%;
      }

      .logo {
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .logo span {
        color: var(--accent-cyan);
      }

      .nav-links a {
        color: var(--text-dim);
        text-decoration: none;
        margin-right: 30px;
        font-size: 0.9rem;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: var(--text-main);
      }

      .btn-login {
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 10px 24px;
        border-radius: 50px;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }

      /* Hero Section */
      .hero {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 60px 8%;
        gap: 40px;
      }

      .hero-content {
        flex: 1;
      }

      .badge {
        background: rgba(0, 242, 254, 0.1);
        color: var(--accent-cyan);
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 20px;
        border: 1px solid rgba(0, 242, 254, 0.2);
      }

      h1 {
        font-size: 4rem;
        line-height: 1.1;
        font-weight: 800;
        margin-bottom: 20px;
      }

      .gradient-text {
        background: linear-gradient(
          90deg,
          var(--accent-cyan),
          var(--accent-purple)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p {
        color: var(--text-dim);
        font-size: 1.1rem;
        line-height: 1.6;
        max-width: 500px;
        margin-bottom: 40px;
      }

      /* Buttons */
      .cta-group {
        display: flex;
        gap: 20px;
        flex-wrap: wrap; /* Agar rapi di mobile */
      }

      .btn-primary {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-radius: 14px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        color: white;
      }

      .btn-primary img {
        width: 20px;
        height: 20px;
      }

      .gemini-btn {
        background: linear-gradient(135deg, #1a73e8, #00f2fe);
        box-shadow: 0 8px 20px rgba(26, 115, 232, 0.3);
      }

      .separator {
        margin: 0 10px;
        color: #333;
        font-weight: 300;
      }

      /* Warna Khas GPT */
      .gpt-btn {
        background: linear-gradient(135deg, #e6e7e7, #989595);
        box-shadow: 0 8px 20px rgba(16, 163, 127, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-5px) scale(1.02);
        filter: brightness(1.1);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 16px 32px;
        border-radius: 12px;
        cursor: pointer;
      }

      /* Powered By Section */
      .powered-by {
        margin-top: 60px;
      }
      .powered-by p {
        font-size: 0.8rem;
        margin-bottom: 10px;
        color: #555;
      }
      .brand-icons {
        display: flex;
        align-items: center;
        gap: 10px;
        filter: grayscale(1);
        opacity: 0.6;
      }
      .brand-icons img {
        width: 24px;
      }
      .brand-icons span {
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      /* Hero Visual Card */
      .hero-visual {
        flex: 1;
        display: flex;
        justify-content: flex-end;
      }
      .glass-card {
        width: 400px;
        height: 300px;
        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(20px);
        padding: 20px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        animation: float 6s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .card-header {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .red {
        background: #ff5f56;
      }
      .yellow {
        background: #ffbd2e;
      }
      .green {
        background: #27c93f;
      }

      .chat-skeleton .line {
        height: 10px;
        background: rgba(255, 255, 255, 0.1);
        margin-bottom: 15px;
        border-radius: 5px;
      }
      .line.short {
        width: 40%;
      }
      .line.long {
        width: 90%;
      }
      .line.medium {
        width: 70%;
      }

      /* Mobile Responsive */
      @media (max-width: 900px) {
        .hero {
          flex-direction: column;
          text-align: center;
        }
        h1 {
          font-size: 2.8rem;
        }
        p {
          margin: 0 auto 40px;
        }
        .cta-group {
          justify-content: center;
        }
        .hero-visual {
          display: none;
        }
      }

      @media (max-width: 600px) {
        .cta-group {
          flex-direction: column;
        }
        .btn-primary {
          width: 100%;
          justify-content: center;
        }
      }
    </style>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-glow"></div>

    <nav>
      <div class="logo">Qabil<span>.</span></div>
      <div class="nav-links">
        <a href="#">-</a>
        <a href="#">-</a>
        <button class="btn-login" onclick="location.href = 'DOXE-QABIL.html'">
          Mulai Chat
        </button>
      </div>
    </nav>

    <main class="hero">
      <section class="hero-content">
        <div class="badge">Powered by Gemini 2.5 Flash</div>
        <h1>
          Qabil Assistenmu <br /><span class="gradient-text"
            >Lebih Manusiawi.</span
          >
        </h1>
        <p>
          Qabil membantu Anda menganalisis dokumen, menulis kode, hingga
          brainstorming ide kreatif dengan kecepatan cahaya dan akurasi tinggi.
        </p>

        <div class="cta-group">
          <!-- Versi Gemini -->
          <button
            class="btn-primary gemini-btn"
            onclick="location.href = 'DOXE-QABIL.html'"
          >
            <img
              src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/google-gemini-icon.png"
              alt="Gemini Logo"
            />
            Powered By Gemini
          </button>

          <!-- Versi GPT -->
          <button
            class="btn-primary gpt-btn"
            onclick="location.href = 'QabilOpenAI.html'"
          >
            <img
              src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/openai-icon.png"
              alt="GPT"
            />
            Powered By OpenAI
          </button>
        </div>

        <div class="powered-by">
          <p>Pilih engine cerdas Anda untuk memulai</p>
          <div class="brand-icons">
            <img
              src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/google-gemini-icon.png"
              alt="Gemini"
            />
            <span>Google Gemini</span>
            <span class="separator">|</span>
            <img
              src="https://uxwing.com/wp-content/themes/uxwing/download/brands-and-social-media/openai-icon.png"
              alt="OpenAI"
            />
            <span>OpenAI</span>
          </div>
        </div>
      </section>

      <!-- Preview UI Sederhana -->
      <section class="hero-visual">
        <div class="glass-card">
          <div class="card-header">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
          </div>
          <div class="card-body">
            <div class="chat-skeleton">
              <div class="line short"></div>
              <div class="line long"></div>
              <div class="line medium"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
